<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsePay — Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(226, 232, 240, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white font-bold text-xl shadow-lg shadow-indigo-500/30 mb-2">P</div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Welcome to PulsePay</h1>
            <p class="text-xs text-slate-400 mt-1">High-conversion merchant portal</p>
        </div>

        <div class="glass-card rounded-3xl p-6 shadow-2xl">
            <!-- Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-white shadow text-slate-900 transition">Sign In</button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition">Create Account</button>
            </div>

            <!-- Forms -->
            <form id="auth-form" class="space-y-4">
                <div id="business-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Business Name</label>
                    <input type="text" id="businessName" placeholder="Acme Store Inc." 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 bg-slate-50">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 bg-slate-50">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 bg-slate-50">
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition">
                    Sign In to Dashboard
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const businessField = document.getElementById('business-field');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                loginTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white shadow text-slate-900 transition";
                signupTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition";
                businessField.classList.add('hidden');
                submitBtn.textContent = "Sign In to Dashboard";
            } else {
                signupTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-white shadow text-slate-900 transition";
                loginTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 transition";
                businessField.classList.remove('hidden');
                submitBtn.textContent = "Create Merchant Account";
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const businessName = document.getElementById('businessName').value;

            const endpoint = currentMode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/signup';
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, businessName })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Connection error with authentication server.');
            }
        });
    </script>
</body>
</html>
